[workspace]
resolver = "2"
members = ["crates/motion-audio", "crates/motion-tts", "crates/motion-lipsync", "crates/motion-voice", "crates/motion-script", "apps/studio-desktop", "crates/motion-scene", "crates/motion-render", "crates/motion-export", "crates/motion-project", "crates/motion-rig", "crates/motion-animation", "crates/motion-jobs"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
