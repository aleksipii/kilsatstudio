[package]
name = "studio-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
motion-scene = { path = "../../crates/motion-scene" }
motion-script = { path = "../../crates/motion-script" }
motion-voice = { path = "../../crates/motion-voice" }
motion-tts = { path = "../../crates/motion-tts" }
motion-audio = { path = "../../crates/motion-audio" }
motion-lipsync = { path = "../../crates/motion-lipsync" }
motion-export = { path = "../../crates/motion-export" }
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
rodio = { version = "=0.20.1", default-features = false }
