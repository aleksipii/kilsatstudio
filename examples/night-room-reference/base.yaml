# Original, self-contained characters for the night-room reference sequence.
# Flat cut-out rigs with bold black outlines and round shapes (ellipse parts and
# rounded control polygons, docs/rig-outlines.md): no third-party art.
# Scenes are generated from shots.yaml; see README.md.
#
# Integrated features (docs/shot-library.md): speaker-coloured captions
# (project.captions), acting rigs (mouth variants mapped to viseme names, eyes
# with gaze and seeded blinks, brow expressions). Lights and the animated phone
# screen live in the project artwork built by crates/motion-export/tests/support.
# Everything is original placeholder art awaiting human review.
#
# Outline modes: `behind` (silhouette parts: a later part's fill covers the
# earlier part's outline, so a body outline sits under the head) and the default
# `over` (facial features drawn on top of the face). Collinear extra control
# points keep a corner tight under `smooth` (rounding spans edge midpoints).
project:
  title: Night room reference (original art)
  fps: 24
  width: 640
  height: 360
  captions:
    enabled: true
    font_size: 28
    fill: '#ffffff'
    speaker_fill: {DAD: '#ffffff', STAN: '#ffd400'}
    outline: '#000000'
    outline_width: 3
    bottom_margin: 0.025
    max_width: 0.8
    line_height: 1.1
    uppercase: true
    # Opaque screen-space strip separates dialogue from the blanket.
    background: '#15121f'
characters:
  # A boy in a pompom beanie and football pyjamas, holding a phone.
  # The origin is his waist; he sits up in bed (the blanket is foreground art).
  STAN:
    asset: characters/stan-cutout
    rig:
      version: 1
      id: stan_cutout
      joints:
        - {id: root, parent: null, x: 0, y: 0}
        - {id: torso, parent: root}
        - {id: head, parent: torso, x: 0, y: -60}
        - {id: arm, parent: torso, x: 24, y: -52, rotation: 0.35}
        # The hand cancels the arm rotation so the phone stays upright and the
        # animated screen layer (axis-aligned artwork) sits on it exactly.
        # World position of the hand with STAN placed at (320, 300): (333.03, 278.06).
        - {id: hand, parent: arm, x: 0, y: 32, rotation: -0.35}
      parts:
        - {id: pyjama_top, joint: torso, points: [[-20, -66], [20, -66], [30, -58], [32, -30], [36, 14], [-36, 14], [-32, -30], [-30, -58]], smooth: 3, color: [60, 100, 190, 255], outline: {width: 1.8, mode: behind}}
        - {id: football_patch_a, joint: torso, points: [[-18, -30], [-10, -34], [-3, -28], [-5, -18], [-15, -17]], smooth: 3, color: [235, 235, 235, 255], outline: {width: 1.1}}
        - {id: football_patch_b, joint: torso, points: [[8, -8], [16, -12], [23, -6], [21, 3], [11, 4]], smooth: 3, color: [235, 235, 235, 255], outline: {width: 1.1}}
        - {id: sleeve, joint: arm, points: [[-8, -4], [8, -4], [8, 34], [-8, 34]], smooth: 3, color: [50, 86, 170, 255], outline: {width: 1.6, mode: behind}}
        - {id: hand_skin, joint: hand, ellipse: {cx: 0, cy: 5, rx: 19.5, ry: 8.5}, color: [240, 196, 160, 255], outline: {width: 1.4, mode: behind}}
        # The phone body; its screen is an animated image layer plus a light in the
        # project artwork (screen_glow), not a rig part. Collinear points keep the
        # corner radius small.
        - {id: phone_body, joint: hand, points: [[-13, -16], [13, -16], [16, -16], [16, -13], [16, 29], [16, 32], [13, 32], [-13, 32], [-16, 32], [-16, 29], [-16, -13], [-16, -16]], smooth: 3, color: [28, 28, 36, 255], outline: {width: 1.4, mode: behind}}
        - {id: head_skin, joint: head, ellipse: {cx: 0, cy: -21, rx: 28, ry: 27}, color: [240, 196, 160, 255], outline: {width: 1.8, mode: behind}}
        # Round eyes: white with a black outline over the face, a round pupil, and
        # a closed lid (skin-coloured, still outlined) while blinking.
        - {id: eye_l, joint: head, ellipse: {cx: -10, cy: -22.5, rx: 9, ry: 10}, color: [244, 244, 248, 255], outline: {width: 1.4}, variants: {blink: {color: [240, 196, 160, 255]}}}
        - {id: pupil_l, joint: head, ellipse: {cx: -10, cy: -22.5, rx: 2.8, ry: 3.4}, color: [30, 24, 40, 255], variants: {blink: {color: [30, 24, 40, 0]}}}
        - {id: eye_r, joint: head, ellipse: {cx: 10, cy: -22.5, rx: 9, ry: 10}, color: [244, 244, 248, 255], outline: {width: 1.4}, variants: {blink: {color: [240, 196, 160, 255]}}}
        - {id: pupil_r, joint: head, ellipse: {cx: 10, cy: -22.5, rx: 2.8, ry: 3.4}, color: [30, 24, 40, 255], variants: {blink: {color: [30, 24, 40, 0]}}}
        - {id: brow_l, joint: head, points: [[-17, -35.5], [-4, -35.5], [-4, -33], [-17, -33]], smooth: 2, color: [40, 26, 26, 255], variants: {worried: {points: [[-17, -34], [-4, -40.5], [-4, -38], [-17, -31.5]]}, raised: {points: [[-17, -38.5], [-4, -38.5], [-4, -36], [-17, -36]]}, angry: {points: [[-17, -37], [-4, -31], [-4, -28.5], [-17, -34.5]]}}}
        - {id: brow_r, joint: head, points: [[4, -35.5], [17, -35.5], [17, -33], [4, -33]], smooth: 2, color: [40, 26, 26, 255], variants: {worried: {points: [[4, -40.5], [17, -34], [17, -31.5], [4, -38]]}, raised: {points: [[4, -38.5], [17, -38.5], [17, -36], [4, -36]]}, angry: {points: [[4, -31], [17, -37], [17, -34.5], [4, -28.5]]}}}
        # Every viseme variant inherits the rounding and the outline.
        - {id: mouth, joint: head, points: [[-6, -8], [6, -8], [5, -4], [-5, -4]], smooth: 3, color: [30, 18, 27, 255], outline: {width: 1.0}, variants: {closed: {points: [[-7, -7], [0, -6], [7, -7], [6, -5], [0, -4], [-6, -5]], color: [30, 18, 27, 255]}, teeth_lip: {points: [[-6, -8], [6, -8], [5, -3], [-5, -3]], color: [235, 225, 215, 255]}, tongue_teeth: {points: [[-5, -8], [5, -8], [5, -3], [-5, -3]], color: [210, 110, 120, 255]}, tongue_up: {points: [[-5, -9], [5, -9], [6, -3], [-6, -3]], color: [190, 90, 100, 255]}, sibilant: {points: [[-7, -7.5], [7, -7.5], [6, -4], [-6, -4]], color: [225, 210, 205, 255]}, sh: {points: [[-2, -10], [3, -10], [6, -7], [4, -2], [-3, -2], [-5, -6]], color: [30, 18, 27, 255]}, r: {points: [[-4, -10], [4, -10], [6, -7], [4, -3], [-4, -2], [-6, -6]], color: [30, 18, 27, 255]}, a: {points: [[-5, -12], [5, -12], [8, -9], [8, -3], [5, 1], [-5, 1], [-8, -3], [-8, -9]], color: [30, 18, 27, 255]}, e: {points: [[-7, -10], [6, -10], [9, -7], [7, -2], [-6, -1], [-9, -5]], color: [30, 18, 27, 255]}, i: {points: [[-9, -8], [7, -8], [10, -6], [8, -3], [-8, -3], [-10, -6]], color: [30, 18, 27, 255]}, o: {points: [[-3, -12], [3, -12], [6, -9], [7, -5], [4, 0], [-3, 0], [-6, -3], [-6, -8]], color: [30, 18, 27, 255]}, u: {points: [[-2, -10], [2, -10], [4, -8], [4, -4], [2, -2], [-2, -2], [-4, -4], [-4, -8]], color: [30, 18, 27, 255]}}}
        - {id: beanie_crown, joint: head, points: [[-26, -41], [26, -41], [29, -41], [28, -58], [16, -71], [-16, -71], [-28, -58], [-29, -41]], smooth: 4, color: [210, 60, 70, 255], outline: {width: 1.8, mode: behind}}
        - {id: beanie_band, joint: head, points: [[-30, -46], [-27, -46], [27, -46], [30, -46], [30, -39], [27, -39], [-27, -39], [-30, -39]], smooth: 4, color: [235, 225, 200, 255], outline: {width: 1.6, mode: behind}}
        - {id: pompom, joint: head, ellipse: {cx: 0, cy: -76, rx: 8.5, ry: 8}, color: [245, 245, 245, 255], outline: {width: 1.6, mode: behind}}
      visemes:
        part: mouth
        map: {closed: closed, teeth_lip: teeth_lip, tongue_teeth: tongue_teeth, tongue_up: tongue_up, sibilant: sibilant, sh: sh, r: r, a: a, e: e, i: i, o: o, u: u}
      expressions:
        sad:
          - {part: brow_l, variant: worried}
          - {part: brow_r, variant: worried}
        surprised:
          - {part: brow_l, variant: raised}
          - {part: brow_r, variant: raised}
        angry:
          - {part: brow_l, variant: angry}
          - {part: brow_r, variant: angry}
      eyes:
        pupils: [pupil_l, pupil_r]
        travel: 3
        blink: {parts: [eye_l, eye_r, pupil_l, pupil_r], variant: blink, interval: 2.2, duration: 0.14}
  # A father in a work shirt. The origin is his waist; feet are 110 px below.
