[package]
name = "motion-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
gpu = ["dep:wgpu", "dep:rustybuzz"]

[dependencies]
rustybuzz = { version = "=0.20.1", optional = true }
wgpu = { version = "=24.0.5", optional = true, default-features = false, features = ["wgsl", "metal"] }
motion-art = { path = "../motion-art" }
motion-rig = { path = "../motion-rig" }
motion-scene = { path = "../motion-scene" }
motion-lipsync = { path = "../motion-lipsync" }
motion-script = { path = "../motion-script" }
ttf-parser = "=0.25.1"
thiserror.workspace = true

[dev-dependencies]
motion-project = { path = "../motion-project" }
sha2 = "0.10"
motion-animation = { path = "../motion-animation" }
serde_json.workspace = true

[[example]]
name = "gpu_probe"
required-features = ["gpu"]

[[example]]
name = "gpu_scene_probe"
required-features = ["gpu"]
