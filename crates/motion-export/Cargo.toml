[package]
name = "motion-export"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
default = []
# Enables the hand-run CPU/GPU parity harness (hardware tests stay #[ignore]).
gpu = ["motion-render/gpu"]

[dependencies]
motion-project = { path = "../motion-project" }
motion-art = { path = "../motion-art" }
motion-jobs = { path = "../motion-jobs" }
motion-audio = { path = "../motion-audio" }
motion-script = { path = "../motion-script" }
motion-scene = { path = "../motion-scene" }
motion-render = { path = "../motion-render" }
motion-lipsync = { path = "../motion-lipsync" }
motion-voice = { path = "../motion-voice" }
motion-tts = { path = "../motion-tts" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
resvg = { version = "=0.45.1", default-features = false, features = ["raster-images"] }
