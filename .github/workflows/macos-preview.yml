name: macOS practical preview
on:
  pull_request:
  push:
    branches: [main, kilsatstudio1.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-silicon-preview:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          rustc --version
          cargo --version
      - name: Install Apple Silicon target
        run: rustup target add aarch64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test runtime helpers
        run: |
          python3 -m pip install numpy==2.3.5
          python3 -m unittest discover -s services/kokoro-runtime/tests -p 'test_*.py' -v
      - name: Test packaging
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build desktop preview
        run: cargo build --locked -p studio-desktop --target aarch64-apple-darwin
      - name: Build explicit Metal fixture helper
        run: cargo build --locked -p motion-render --features gpu --example gpu_probe --target aarch64-apple-darwin
      - name: Save resolved workspace build observations
        run: |
          mkdir -p dist/build-inputs
          cargo metadata --locked --filter-platform aarch64-apple-darwin --format-version 1 > dist/build-inputs/desktop-metadata.json
          cargo metadata --locked --filter-platform aarch64-apple-darwin --format-version 1 --features motion-render/gpu > dist/build-inputs/helper-metadata.json
          rustc -vV > dist/build-inputs/rustc.txt
          cargo -V > dist/build-inputs/cargo.txt
          cp Cargo.lock dist/build-inputs/Cargo.lock
      - name: Package ad-hoc signed app
        run: |
          binary=target/aarch64-apple-darwin/debug/studio-desktop
          test "$(lipo -archs "$binary")" = arm64
          otool -L "$binary"
          python3 - "$binary" <<'PY'
          import subprocess, sys
          lines = subprocess.check_output(["otool", "-L", sys.argv[1]], text=True).splitlines()[1:]
          for line in lines:
              library = line.strip().split(" (", 1)[0]
              if not library.startswith(("/System/Library/", "/usr/lib/")):
                  raise SystemExit(f"Unexpected non-system runtime dependency: {library}")
          PY
          helper=target/aarch64-apple-darwin/debug/examples/gpu_probe
          test "$(lipo -archs "$helper")" = arm64
          python3 - "$helper" <<'PY'
          import subprocess, sys
          for line in subprocess.check_output(["otool", "-L", sys.argv[1]], text=True).splitlines()[1:]:
              library = line.strip().split(" (", 1)[0]
              if not library.startswith(("/System/Library/", "/usr/lib/")):
                  raise SystemExit(f"Unexpected helper dependency: {library}")
          PY
          strip -x "$helper"
          strip -x "$binary"
          python3 scripts/package_macos.py --binary "$binary" --gpu-probe "$helper" --output dist/Kilsat-Studio-Preview-arm64.zip --commit "$GITHUB_SHA" --arch arm64 --profile debug
      - name: Verify packaged diagnostic helpers
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          root = 'Kilsat Studio Preview.app/Contents/Resources/services/kokoro-runtime/'
          with zipfile.ZipFile('dist/Kilsat-Studio-Preview-arm64.zip') as archive:
              license_text = Path('LICENSE').read_bytes()
              for entry in ['LICENSE', 'Kilsat Studio Preview.app/Contents/Resources/LICENSE']:
                  if archive.read(entry) != license_text:
                      raise SystemExit(f'Packaged {entry} differs from source')
              helper = archive.getinfo('Kilsat Studio Preview.app/Contents/Resources/bin/gpu_probe')
              if not (helper.external_attr >> 16) & 0o111:
                  raise SystemExit('GPU helper lost executable permissions')
              for helper in ['doctor.py', 'smoke_macos.py', 'acceptance.py', 'setup_kokoro.py', 'setup-manifest.json']:
                  source = Path('services/kokoro-runtime', helper).read_bytes()
                  if archive.read(root + helper) != source:
                      raise SystemExit(f'Packaged {helper} differs from source')
          PY
      - name: Inventory final signed ZIP (not license approval)
        run: |
          python3 scripts/package_audit.py --archive dist/Kilsat-Studio-Preview-arm64.zip --commit "$GITHUB_SHA" --target aarch64-apple-darwin --profile debug --require-signature-metadata --output dist/Kilsat-Studio-Preview-arm64.audit.json
      - name: Bind final executable linkage observations and build evidence
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess, tempfile, zipfile
          from pathlib import Path
          audit = json.loads(Path('dist/Kilsat-Studio-Preview-arm64.audit.json').read_text())
          records = {row['path']: row for row in audit['files']}
          members = ['Kilsat Studio Preview.app/Contents/MacOS/studio-desktop',
                     'Kilsat Studio Preview.app/Contents/Resources/bin/gpu_probe']
          observations = {}
          with tempfile.TemporaryDirectory(prefix='kilsat-native-observation-') as temporary:
              with zipfile.ZipFile('dist/Kilsat-Studio-Preview-arm64.zip') as archive:
                  for index, member in enumerate(members):
                      info = archive.getinfo(member)
                      if info.file_size > 128 * 1024 * 1024:
                          raise SystemExit('Executable observation exceeds byte budget')
                      data = archive.read(info)
                      digest = hashlib.sha256(data).hexdigest()
                      if digest != records[member]['sha256']:
                          raise SystemExit('Final member differs from package audit')
                      selected = Path(temporary, f'executable-{index}')
                      selected.write_bytes(data)
                      archs = subprocess.check_output(['lipo', '-archs', str(selected)], text=True)
                      libraries = subprocess.check_output(['otool', '-L', str(selected)], text=True)
                      if archs.strip() != 'arm64':
                          raise SystemExit('Final executable is not arm64')
                      for line in libraries.splitlines()[1:]:
                          library = line.strip().split(' (', 1)[0]
                          if not library.startswith(('/System/Library/', '/usr/lib/')):
                              raise SystemExit('Unexpected final native dependency: ' + library)
                      observations[member] = dict(sha256=digest, lipo_archs=archs, otool_libraries=libraries)
          Path('dist/build-inputs/native.json').write_text(json.dumps(observations, indent=2, sort_keys=True) + '\n')
          PY
          python3 scripts/build_evidence.py --archive dist/Kilsat-Studio-Preview-arm64.zip --audit dist/Kilsat-Studio-Preview-arm64.audit.json --lock Cargo.lock --desktop-metadata dist/build-inputs/desktop-metadata.json --helper-metadata dist/build-inputs/helper-metadata.json --rustc dist/build-inputs/rustc.txt --cargo dist/build-inputs/cargo.txt --native-observations dist/build-inputs/native.json --output dist/Kilsat-Studio-Preview-arm64.build-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: Kilsat-Studio-Preview-arm64
          path: |
            dist/Kilsat-Studio-Preview-arm64.zip
            dist/Kilsat-Studio-Preview-arm64.audit.json
            dist/Kilsat-Studio-Preview-arm64.build-evidence.json
            dist/build-inputs/
          if-no-files-found: error
          retention-days: 14
