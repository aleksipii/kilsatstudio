name: Audio foundation
on: [push, pull_request]
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo check --workspace
      - run: cargo clippy --keep-going --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - name: Render night-room visual review frames (placeholder audio)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --locked -p motion-export --example night_room_reference -- frames out/night-room-review
          cargo run --locked -p motion-export --example night_room_reference -- report > out/night-room-review/timing.txt
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: night-room-visual-review-${{ github.sha }}
          path: out/night-room-review/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install numpy==2.3.5
      - run: python3 -m unittest discover -s services/kokoro-runtime/tests -p 'test_*.py'
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  gpu-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --locked -p motion-render --features gpu --lib
      - run: cargo test --locked -p motion-render --features gpu --example gpu_scene_probe
      - run: cargo clippy --keep-going --locked -p motion-render --features gpu --all-targets -- -D warnings

  media-encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install local test encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify actual encoded media
        env:
          KILSAT_TEST_FFMPEG: /usr/bin/ffmpeg
          KILSAT_TEST_FFPROBE: /usr/bin/ffprobe
          REAL_FFMPEG: /usr/bin/ffmpeg
        run: |
          cargo test --locked -p motion-export real_ffmpeg_encodes_h264_aac -- --ignored
          cargo test --locked -p motion-export embedded_art_is_retained_in_real_mp4_pipeline -- --ignored
          cargo test --locked -p motion-export real_ffmpeg_sequence_has_duration_and_crossfade_color -- --ignored
      - name: Export night-room review MP4 (placeholder tones, not speech)
        run: cargo run --locked -p motion-export --example night_room_reference -- export out/night-room-video --ffmpeg /usr/bin/ffmpeg
      - uses: actions/upload-artifact@v4
        with:
          name: night-room-placeholder-video-${{ github.sha }}
          path: |
            out/night-room-video/sequence.mp4
          if-no-files-found: error
          retention-days: 14
