name: English episode renders
on:
  push:
    branches: [feat/english-kilsat-episodes, main]
    paths:
      - .github/english-render-request.json
      - .github/workflows/english-episode-previews.yml
      - examples/kilsat-english/**
      - scripts/generate_kilsat_english.py
      - scripts/render_kilsat_english.py
  workflow_dispatch:
    inputs:
      allow_downloads:
        type: boolean
        default: false
        description: Allow pinned Kokoro model, English voices and runtime downloads
permissions:
  contents: read
concurrency:
  group: english-episodes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  english-episodes:
    if: github.event_name == 'push' || inputs.allow_downloads
    runs-on: macos-15
    timeout-minutes: 40
    env:
      ENGLISH_OUTPUT: ${{ github.workspace }}/out/kilsat-english
    steps:
      - uses: actions/checkout@v4
      - name: Check the explicit English render request
        run: |
          test "$(uname -m)" = arm64
          echo "KOKORO_ROOT=$RUNNER_TEMP/kokoro-english" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(Path('.github/english-render-request.json').read_text())
          assert request['schema_version'] == 1
          assert request['allow_downloads'] is True
          assert request['publication_approved'] is False
          assert request['episodes'] == [1, 2, 3]
          assert request['language'] == 'en-us'
          assert request['model'] == 'hexgrad/Kokoro-82M'
          assert request['voices'] == {'AINO': 'af_heart', 'RANE': 'am_michael'}
          assert (request['render_profile'], request['fps']) == ('full_hd', 24)
          PY
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the existing production renderer
        run: cargo build --release --locked -p motion-export --example production_export
      - name: Restore the pinned local speech environment
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.KOKORO_ROOT }}
          key: english-episodes-kokoro-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('services/kokoro-runtime/setup-manifest.json') }}
      - name: Install the explicitly requested pinned Kokoro assets
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ENGLISH_OUTPUT"
          python3 -I services/kokoro-runtime/setup_kokoro.py --root "$KOKORO_ROOT" --manifest "$GITHUB_WORKSPACE/services/kokoro-runtime/setup-manifest.json" --allow-downloads > "$ENGLISH_OUTPUT/setup-log.jsonl"
      - name: Re-verify model, voices and retained environment evidence
        run: |
          mkdir -p "$ENGLISH_OUTPUT/evidence"
          python3 -I scripts/real_speech_ci.py verify --manifest services/kokoro-runtime/setup-manifest.json --assets "$KOKORO_ROOT/assets"
          python3 - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('setup_kokoro', 'services/kokoro-runtime/setup_kokoro.py')
          setup = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(setup)
          root, out = Path(os.environ['KOKORO_ROOT']), Path(os.environ['ENGLISH_OUTPUT'])
          managed = json.loads((root / 'profile.json').read_text())
          setup.validate_profile_evidence(managed, root)
          profile = dict(python=managed['python'], runtime_script=str(Path('services/kokoro-runtime/runtime.py').resolve()),
                         model_config=managed['config'], model_weights=managed['model'], voices_directory=managed['voices'],
                         cache_directory=managed['cache'], model_version=managed['revision'], timeout_seconds=120)
          (out / 'kokoro-profile.json').write_text(json.dumps(profile, indent=2) + '\n')
          PY
          cp services/kokoro-runtime/setup-manifest.json "$ENGLISH_OUTPUT/evidence/"
          cp "$KOKORO_ROOT/evidence/"*.json "$KOKORO_ROOT/evidence/freeze.txt" "$ENGLISH_OUTPUT/evidence/"
      - name: Retain the verified environment for subsequent render attempts
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.KOKORO_ROOT }}
          key: english-episodes-kokoro-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('services/kokoro-runtime/setup-manifest.json') }}
      - name: Ensure local media encoders
        run: command -v ffmpeg && command -v ffprobe || brew install ffmpeg
      - name: Render three real English Full HD episodes
        id: render
        run: |
          python3 scripts/render_kilsat_english.py --exporter "$GITHUB_WORKSPACE/target/release/examples/production_export" --kokoro-config "$ENGLISH_OUTPUT/kokoro-profile.json" --ffmpeg "$(command -v ffmpeg)" --ffprobe "$(command -v ffprobe)" --output "$ENGLISH_OUTPUT/videos"
      - name: Retain the exact inference traceback after a render failure
        if: failure() && steps.render.outcome == 'failure'
        timeout-minutes: 3
        run: |
          "$KOKORO_ROOT/venv/bin/python" - <<'PY' 2>&1 | tee "$ENGLISH_OUTPUT/inference-diagnostic.txt"
          import importlib.util, json, os, tempfile, traceback
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('runtime', 'services/kokoro-runtime/runtime.py')
          runtime = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runtime)
          root = Path(os.environ['KOKORO_ROOT'])
          line = json.loads(Path('examples/kilsat-english/stories.json').read_text())['episodes'][0]['turns'][0]
          with tempfile.TemporaryDirectory() as temporary:
              request = dict(protocol=1, request=dict(text=line, voice=dict(preset='af_heart', language='en-us', speed=1.0)),
                             config_path=str(root / 'assets/config.json'), model_path=str(root / 'assets/kokoro-v1_0.pth'),
                             voice_path=str(root / 'assets/voices/af_heart.pt'), output_path=str(Path(temporary) / 'diagnostic.wav'))
              try:
                  print(runtime.synthesize(request))
              except Exception:
                  traceback.print_exc()
          PY
      - name: Extract actual video review frames
        run: |
          for episode in ep01 ep02 ep03; do
            ffmpeg -v error -ss 2 -i "$ENGLISH_OUTPUT/videos/$episode/sequence.mp4" -frames:v 1 -vf scale=960:540 "$ENGLISH_OUTPUT/videos/$episode/review-opening.png"
            ffmpeg -v error -ss 28 -i "$ENGLISH_OUTPUT/videos/$episode/sequence.mp4" -frames:v 1 -vf scale=960:540 "$ENGLISH_OUTPUT/videos/$episode/review-later.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kilsat-english-fullhd-${{ github.sha }}
          path: out/kilsat-english/
          if-no-files-found: error
          retention-days: 30
