name: Koeta Studio release app
on:
  push:
    branches: [main, kilsatstudio1.0]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-app:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test packaging scripts
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build, package and audit the release app
        run: scripts/build_release_app.sh dist
      - name: Launch smoke check (binary starts and reports its version)
        run: |
          cd dist && ditto -x -k Koeta-Studio-*-universal.zip unpacked
          codesign --verify --deep --strict "unpacked/Koeta Studio.app"
          plutil -p "unpacked/Koeta Studio.app/Contents/Info.plist" | grep -E 'CFBundleShortVersionString|CFBundleName'
          app="unpacked/Koeta Studio.app/Contents"
          for executable in "$app/MacOS/"* "$app/Resources/bin/gpu_probe" "$app/Resources/bin/head_pose"; do
            test "$(lipo -archs "$executable")" = "x86_64 arm64" || { echo "::error::$executable is not universal"; exit 1; }
          done
          plutil -extract LSMinimumSystemVersion raw "$app/Info.plist" | grep -qx '13.0'
      - uses: actions/upload-artifact@v4
        with:
          name: koeta-studio-release-universal-${{ github.sha }}
          path: |
            dist/Koeta-Studio-*-universal.zip
            dist/Koeta-Studio-*-universal.zip.sha256
            dist/package-audit.json
          if-no-files-found: error
          retention-days: 30
